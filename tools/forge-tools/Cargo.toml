[package]
name = "forge-tools"
version = "0.1.0"
edition = "2024"
description = "Deterministic Rust tooling for the rust-forge Claude Code plugin"
repository = "https://github.com/0keanix/rust-forge"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml_edit = "0.25.18"
ureq = "3.5.1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
